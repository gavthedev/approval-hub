upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name approvalhub.ch www.approvalhub.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name approvalhub.ch www.approvalhub.ch;

    ssl_certificate /etc/letsencrypt/live/approvalhub.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/approvalhub.ch/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
