upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name approvalhub.ch www.approvalhub.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name approvalhub.ch www.approvalhub.ch;

    ssl_certificate /etc/letsencrypt/live/approvalhub.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/approvalhub.ch/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}